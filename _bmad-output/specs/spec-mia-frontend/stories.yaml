- id: "1-1"
  title: "Project scaffold with enforced architecture"
  description: >-
    As the product owner, I want the greenfield project scaffolded with the
    spine's structure and quality gates enforced from the first commit, so that
    every later story lands inside fences that make the binding contracts mechanical.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-2"
  title: "Localized anonymous entry"
  description: >-
    As a visitor on a shared device, I want MIA to greet me in my language with
    a visible locale and text-size choice, so that I can use the entry surfaces
    before signing in.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-3"
  title: "Password sign-in with restricted-stage isolation"
  description: >-
    As a user, I want to sign in with username and password, so that I can
    reach my authorized workspace.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-4"
  title: "MFA challenge and recovery-code sign-in"
  description: >-
    As a user with MFA enabled, I want to complete the MFA challenge or fall
    back to a recovery code, so that I can sign in even without my authenticator.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-5"
  title: "Forced password replacement"
  description: >-
    As a user with a temporary password, I want to be guided through replacing
    it before anything else, so that my account is secured before I reach
    protected content.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-6"
  title: "Password recovery and token reset"
  description: >-
    As a user who lost their password, I want a recovery path and a token-based
    reset, so that I can regain access without staff seeing my new password.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-7"
  title: "Invitation preview and acceptance"
  description: >-
    As an invited user, I want to preview and accept my invitation safely, so
    that I can join MIA with the invited role.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-8"
  title: "Session lifecycle — idle warning, expiry shield, logout (BCG-001-gated closure)"
  description: >-
    As a signed-in user on a shared device, I want warnings before expiry and a
    logout that never lies, so that my data is protected when my session ends.
  spec_checkpoint: false
  done_checkpoint: false
- id: "1-9"
  title: "TOTP enrollment and recovery codes"
  description: >-
    As a user setting up MFA, I want QR-based TOTP enrollment and one-time
    recovery codes, so that I can secure my account with my authenticator app.
  spec_checkpoint: false
  done_checkpoint: false
