name: Checks

# Mirrors ./run-all-tests.sh stage by stage. Keep both in sync when a stage changes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  static:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Hygiene runner negative tests
        run: npm run test:hygiene-runner
      - name: Early hygiene inventory
        run: npm run check:hygiene-inventory
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck coverage
        run: npm run check:typecheck-coverage
      - name: Lint and architecture fences
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Message catalogs
        run: npm run check:i18n

  build-and-browser:
    name: Build, bundle budget, E2E, and secret hygiene
    # Automated E2E runs only on bundled Chromium on macOS (.agents/rules/testing.md).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Initial-route bundle budget
        run: npm run check:bundle-size
      - name: Owned E2E and secret hygiene against this build
        run: npm run check:browser-gate:built

  duplication:
    name: Duplication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Duplication markers and clone detection
        run: ./scripts/check-duplication.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        run: npm audit --audit-level=high

  trivy:
    name: Trivy vulnerability and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Trivy scan
        run: ./scripts/check-trivy.sh

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Markdown lint
        run: ./scripts/check-markdown.sh

  local-only:
    name: Local-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # These checks need inputs CI deliberately does not have, so they run only in
      # ./run-all-tests.sh. A skip is not a pass.
      - name: Report skipped API type check
        run: echo "::warning title=Skipped::API wire type check needs the sibling backend checkout (./mia), which CI does not use. Run ./run-all-tests.sh locally."
      - name: Report skipped Tailwind Plus catalog check
        run: echo "::warning title=Skipped::Tailwind Plus catalog check needs the licensed library, which is not available in CI. Run ./run-all-tests.sh locally."
